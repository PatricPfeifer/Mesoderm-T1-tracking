[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-patric"
version = "0.1.0"
description = "Napari interface for Cellpose segmentation, cell tracking, and T1 detection"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "napari>=0.4.18",
    "qtpy",
]

[project.entry-points."napari.manifest"]
napari-patric = "napari_patric:napari.yaml"

[tool.setuptools]
packages = ["napari_patric"]

[tool.setuptools.package-data]
napari_patric = ["napari.yaml", "feature_help/*"]
